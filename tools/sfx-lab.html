<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔王採用試験 効果音試聴室</title>
<style>
body{margin:0;background:#14101c;color:#ece7f5;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}
h1{color:#f0c46a}.family{background:#241d38;border:1px solid #453a63;border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}button{min-width:110px;padding:12px;border:1px solid #7655a8;border-radius:8px;background:#392755;color:#fff;font-size:16px;cursor:pointer}
p{color:#b7a9ce}.now{color:#79e39c;font-weight:bold;min-height:1.6em}
</style>
</head>
<body><main>
<h1>⚔ 効果音試聴室</h1>
<p>上段はゲームに仮接続したCC0実録音です。斬撃・打撃・刺突用の短い打撃・金属防御を聞き比べてください。旧合成音は比較用に残しています。</p>
<p><a href="../battle-preview.html" style="color:#f0c46a">戦闘試写室で動きと一緒に確認する</a></p>
<div id="families"></div><div class="now" id="now"></div>
</main>
<script>
const current={basun:'ばすん — 肉厚な打撃',gachan:'がちゃん — 金属衝突',zushi:'ずし — 重量のある決定打',zuba:'ずばっ — 素早い斬撃'};
const candidateGroups=[
  { id:'starninjas-sword', label:'候補：剣の風切り — StarNinjas（実録ナイフ）', prefix:'candidate-starninjas-sword-', count:10 },
  { id:'starninjas-clash', label:'候補：剣・盾の金属衝突 — StarNinjas（実録ナイフ）', prefix:'candidate-starninjas-clash-', count:10 },
  { id:'antum-thwack', label:'候補：鈍い打撃 — AntumDeluge（物を叩いた実録）', prefix:'candidate-antum-thwack-', count:10 },
  { id:'artisticdude-swish', label:'候補：ズバッ／しゃり — artisticdude（衣類・木材の実録）', prefix:'candidate-artisticdude-swish-', count:13 },
];
const root=document.getElementById('families'), now=document.getElementById('now');
function addGroup(desc, files, path){
  const box=document.createElement('section');box.className='family';
  box.innerHTML=`<h2>${desc}</h2><div class="row">${files.map(({file,label})=>`<button data-path="${path}" data-file="${file}">▶ ${label}</button>`).join('')}</div>`;
  root.appendChild(box);
}
for(const [name,desc] of Object.entries({slash:'実録：斬撃',blunt:'実録：打撃',pierce:'実録：刺突用の短い打撃',guard:'実録：金属防御'})) addGroup(desc,['a','b','c'].map(v=>({file:`${name}-${v}.wav`,label:v.toUpperCase()})),'../assets/sfx/recorded/');
for(const [name,desc] of Object.entries(current)) addGroup('旧合成：'+desc,['a','b','c'].map(v=>({file:`${name}-${v}.wav`,label:`旧 ${v.toUpperCase()}`})),'../assets/sfx/');
for(const group of candidateGroups) addGroup(group.label,Array.from({length:group.count},(_,i)=>{const n=String(i+1).padStart(2,'0');return {file:`${group.prefix}${n}.wav`,label:`候補 ${n}`};}),'../assets/sfx/candidates/');
let playing;
root.addEventListener('click',e=>{const b=e.target.closest('[data-file]');if(!b)return;if(playing)playing.pause();const a=playing=new Audio(b.dataset.path+b.dataset.file);a.volume=.65;a.play();now.textContent='再生中: '+b.dataset.file;});
</script></body></html>
