<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>戦闘モーション試写室</title>
<link rel="stylesheet" href="src/styles.css"><link rel="stylesheet" href="src/battlefield.css">
</head>
<body>
<header style="max-width:1128px;margin:20px auto;padding:0 12px">
  <h1 style="font-size:20px">戦闘モーション試写室</h1>
  <p>演出確認用の固定シナリオです。本編のセーブ・戦績は変更しません。</p>
  <button id="replay">▶ 1対1を再生</button>
  <button id="crowd">5対5を確認</button>
  <button id="spectacle" style="font-weight:bold">🔥 シナジーと連鎖の演出を確認</button>
  <button id="ranged">弓と魔法を確認</button>
  <button id="arrival">召喚と復活を確認</button>
  <button id="species">スライム・骸骨兵を確認</button>
  <button id="orc">オークの斧撃を確認</button>
  <button id="swordsman">剣士の斬撃を確認</button>
  <button id="archer">弓兵を確認</button>
  <button id="cleric">聖職者を確認</button>
  <button id="sage">賢者を確認</button>
  <button id="mage">魔法使いを確認</button>
  <button id="imp">インプを確認</button>
  <button id="necromancer">死霊術師を確認</button>
  <button id="kobold">コボルトを確認</button>
  <button id="zombie">ゾンビを確認</button><button id="ogre">オーガを確認</button><button id="king_slime">キングスライムを確認</button>
<button id="shield">盾兵を確認</button><button id="slinger">投石兵を確認</button><button id="axeman">斧兵を確認</button><button id="cavalry">騎兵を確認</button><button id="commander">指揮官を確認</button><button id="hero">勇者を確認</button></header>
<div id="app"></div>
<script src="src/data/portraits.js"></script>
<script src="src/core/util.js"></script>
<script src="src/ui/ui.js"></script>
<script>const Game = { state: { generation: 1 }, MAX_CONQUEST: 8 };</script>
<script src="src/ui/battle_scene.js"></script>
<script>
UI.init(document.getElementById('app'));
BattleScene.loadSpeed = () => {};
BattleScene.saveSpeed = () => {};
function replay(count = 1, ranged = false, species = false) {
  const player = Array.from({ length: count }, (_, i) => ({ id: 'p' + i, tplId: 'goblin', side: 'player', name: 'ゴブ太' + (i || ''), icon: '👺', hp: 30, maxHp: 30 }));
  const enemy = Array.from({ length: count }, (_, i) => ({ id: 'e' + i, side: 'enemy', name: '剣士見習い' + (i || ''), icon: '🗡', hp: 24, maxHp: 24 }));
  if (ranged) {
    Object.assign(player[0], { tplId: 'mage', name: '魔法使い', icon: '🔥' });
    Object.assign(enemy[0], { name: '王国弓兵', icon: '🏹' });
  }
  if (species) {
    for (let i = 0; i < count; i++) {
      const slime = i % 2 === 0;
      Object.assign(player[i], { tplId: slime ? 'slime' : 'skeleton', name: slime ? 'ぷに' : '骸骨兵', icon: slime ? '💧' : '💀' });
      Object.assign(enemy[i], { tplId: slime ? 'skeleton' : 'slime', name: slime ? '骸骨兵' : 'ぷるん', icon: slime ? '💀' : '💧' });
    }
  }
  if (species === 'orc') {
    for (const unit of [...player, ...enemy]) Object.assign(unit, { tplId: 'orc', name: 'オーク', icon: '👹' });
  }
  if (species === 'swordsman') {
    for (const unit of [...player, ...enemy]) Object.assign(unit, { tplId: 'swordsman', name: '剣士', icon: '🗡' });
  }
  const roles = { archer: ['弓兵', '🏹'], cleric: ['聖職者', '✨'], sage: ['賢者', '📖'], mage: ['魔法使い', '🔥'], imp: ['インプ', '😈'], necromancer: ['死霊術師', '💀'], kobold: ['コボルト', '🐶'], zombie: ['ゾンビ', '🧟'], ogre: ['オーガ', '👹'], king_slime: ['キングスライム', '💧'], shield: ['盾兵', '🛡️'], slinger: ['投石兵', '🪨'], axeman: ['斧兵', '🪓'], cavalry: ['騎兵', '🐎'], commander: ['指揮官', '🎖️'], hero: ['勇者', '👑'] };
  if (roles[species]) {
    for (const unit of [...player, ...enemy]) Object.assign(unit, { tplId: species, name: roles[species][0], icon: roles[species][1] });
  }
  UI.set(BattleScene.shell({ stage: 1, army: '見習い冒険者', region: '演出試写' }));
  const events = [{ type: 'battle_start', player, enemy }, { type: 'round_start', round: 1 }];
  for (let i = 0; i < count; i++) {
    events.push({ type: 'attack', fromId: 'p' + i, toId: 'e' + i, dmg: 8, hp: 16, maxHp: 24, emphasis: 1 });
    events.push({ type: 'attack', fromId: 'e' + i, toId: 'p' + i, dmg: 9, hp: 21, maxHp: 30, emphasis: 1 });
  }
  events.push({ type: 'trait_trigger', sourceId: 'p0', name: ranged ? '魔力集中（試写用）' : '群れの本能', traitId: ranged ? 'arcane_circle' : 'goblin_horde', text: '試写用：能力発火から追撃へ' },
    { type: 'attack', fromId: 'p0', toId: 'e0', dmg: 12, hp: 4, maxHp: 24, emphasis: 2, chainDepth: 2 },
    { type: 'splash', fromId: 'p0', toId: 'e0', dmg: 10, hp: 0, maxHp: 24, emphasis: 3, chainDepth: 3, label: '追撃' },
    { type: 'death', unitId: 'e0' },
    { type: 'overkill', toId: 'e0', percent: 150, excess: 6, rank: '蹂躙', emphasis: 2, chainDepth: 4 },
    { type: 'result', victory: true });
  BattleScene.play(events, () => { document.getElementById('next-btn').textContent = 'もう一度見る'; });
}
document.getElementById('replay').onclick = () => replay();
document.getElementById('crowd').onclick = () => replay(5);
document.getElementById('ranged').onclick = () => replay(1, true);
document.getElementById('species').onclick = () => replay(2, false, true);
document.getElementById('orc').onclick = () => replay(1, false, 'orc');
document.getElementById('swordsman').onclick = () => replay(1, false, 'swordsman');
for (const id of ['archer', 'cleric', 'sage', 'mage', 'imp', 'necromancer', 'kobold', 'zombie', 'ogre', 'king_slime', 'shield', 'slinger', 'axeman', 'cavalry', 'commander', 'hero']) document.getElementById(id).onclick = () => replay(1, false, id);
function replayArrival() {
  UI.set(BattleScene.shell({ stage: 1, army: '演出確認', region: '召喚・復活' }));
  const player = [{ id: 'p0', tplId: 'goblin', side: 'player', name: 'ゴブ太', icon: '👺', hp: 30, maxHp: 30 }];
  const enemy = [{ id: 'e0', side: 'enemy', name: '剣士見習い', icon: '🗡', hp: 24, maxHp: 24 }];
  BattleScene.play([
    { type: 'battle_start', player, enemy },
    { type: 'attack', fromId: 'e0', toId: 'p0', dmg: 30, hp: 0, maxHp: 30 },
    { type: 'death', unitId: 'p0' },
    { type: 'summon', unit: { id: 'ps0', side: 'player', name: '召喚スケルトン', icon: '💀', hp: 12, maxHp: 12 } },
    { type: 'revive', unitId: 'p0', hp: 10, maxHp: 30 },
    { type: 'attack', fromId: 'ps0', toId: 'e0', dmg: 24, hp: 0, maxHp: 24 },
    { type: 'death', unitId: 'e0' },
    { type: 'result', victory: true }
  ], () => {});
}
document.getElementById('arrival').onclick = replayArrival;

// シナジーの重ねがけ→魔王軍完成→OVERKILL→連鎖伝播、という「見せ場」だけを通しで見る。
// 実プレイでは揃わないと出ないので、演出の調整はここで行う。
function replaySpectacle() {
  const player = Array.from({ length: 3 }, (_, i) => ({ id: 'p' + i, tplId: 'goblin', side: 'player', name: 'ゴブ太' + (i || ''), icon: '👺', hp: 40, maxHp: 40 }));
  const enemy = Array.from({ length: 5 }, (_, i) => ({ id: 'e' + i, side: 'enemy', name: '剣士見習い' + (i || ''), icon: '🗡', hp: 20, maxHp: 20 }));
  let n = 0;
  const ev = (o) => ({ eventId: 'ev' + (++n), emphasis: 0, ...o });
  const events = [
    ev({ type: 'battle_start', player, enemy, text: '戦闘開始' }),
    ev({ type: 'round_start', round: 1 }),
    ev({ type: 'synergy', id: 'goblin_horde', name: 'ゴブリン軍団', desc: '出撃したゴブリンの与ダメージ+12%刻み' }),
    ev({ type: 'synergy', id: 'arcane_circle', name: '魔法結社', desc: '出撃した魔法職の与ダメージ+18%刻み' }),
    ev({ type: 'synergy', id: 'legion_of_dead', name: '死の軍勢', desc: 'アンデッドの与ダメージ+22%刻み' }),
    ev({ type: 'synergy', id: 'overload', name: '魔王軍完成', desc: '同時発動数-1につき出撃隊全員+20%' }),
    // 連鎖：攻撃→死亡→OVERKILL→伝播→死亡→伝播…と深さが伸びていく
    ev({ type: 'attack', fromId: 'p0', toId: 'e0', dmg: 60, hp: 0, maxHp: 20, dead: true, chainId: 'c1', chainDepth: 1, text: 'ゴブ太 → 剣士見習い に 60 ダメージ' }),
    ev({ type: 'overkill', fromId: 'p0', toId: 'e0', excess: 40, percent: 200, rankId: 'overkill', rank: '蹂躙', emphasis: 3, chainId: 'c1', chainDepth: 2 }),
    ev({ type: 'trait_trigger', sourceId: 'p0', traitId: 'overload', name: '魔王軍完成', emphasis: 3, chainId: 'c1', chainDepth: 3, text: '余剰が伝播！' }),
    ev({ type: 'attack', fromId: 'p0', toId: 'e1', dmg: 44, hp: 0, maxHp: 20, dead: true, label: '魔王軍完成', chainId: 'c1', chainDepth: 4, text: '伝播 → 剣士見習い1 に 44 ダメージ' }),
    ev({ type: 'trait_trigger', sourceId: 'p0', traitId: 'overload', name: '魔王軍完成', emphasis: 3, chainId: 'c1', chainDepth: 5, text: 'さらに伝播！' }),
    ev({ type: 'attack', fromId: 'p0', toId: 'e2', dmg: 38, hp: 0, maxHp: 20, dead: true, label: '魔王軍完成', chainId: 'c1', chainDepth: 6, text: '伝播 → 剣士見習い2 に 38 ダメージ' }),
    ev({ type: 'round_start', round: 2 }),
    ev({ type: 'attack', fromId: 'p1', toId: 'e3', dmg: 22, hp: 0, maxHp: 20, dead: true, chainId: 'c2', chainDepth: 1, text: 'ゴブ太1 → 剣士見習い3 に 22 ダメージ' }),
    ev({ type: 'result', victory: true })
  ];
  BattleScene.play(events, () => { document.getElementById('next-btn').textContent = 'もう一度見る'; });
}
document.getElementById('spectacle').onclick = replaySpectacle;
UI.bind(action => { if (action === 'speed') BattleScene.cycleSpeed(); if (action === 'skiplog') BattleScene.skip(); if (action === 'afterbattle') replay(); });
replay();
</script>
</body>
</html>
