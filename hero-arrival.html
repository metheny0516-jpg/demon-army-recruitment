<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="stylesheet" href="src/styles.css">

<style>
/* 試作専用。本編の styles.css は戦闘画面のために読むだけで、上書きしない。 */
.pa-wrap { max-width: 1080px; margin: 0 auto; padding: 16px 12px 64px; }
.pa-top h1 { font-size: 22px; margin: 8px 0 4px; }
.pa-lead { margin: 0 0 16px; line-height: 1.7; opacity: .85; }
.pa-panel { border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 14px 16px; margin: 0 0 16px; background: rgba(0,0,0,.18); }
.pa-panel h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: .08em; }
.pa-facts { margin: 0; padding-left: 1.2em; line-height: 1.9; }
.pa-cond { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.pa-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pa-table th, .pa-table td { border-bottom: 1px solid rgba(255,255,255,.1); padding: 5px 8px; text-align: left; vertical-align: top; }
.pa-note { font-size: 12px; opacity: .7; line-height: 1.7; margin: 8px 0 0; }
.pa-note-hot { opacity: 1; color: #ffd479; }
.pa-routine { font-size: 12px; opacity: .55; margin: 10px 0 0; }
.pa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.pa-card { border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 10px; background: rgba(255,255,255,.03); }
.pa-card.is-hired { border-color: rgba(255,214,120,.45); }
.pa-card.is-selected { border-color: #ffd479; box-shadow: 0 0 0 1px #ffd479 inset; }
.pa-card.is-dead { opacity: .4; }
.pa-head { display: flex; gap: 10px; align-items: flex-start; }
.pa-face { width: 52px; height: 52px; object-fit: cover; object-position: top center; border-radius: 6px; flex: none; }
.pa-face-emoji { font-size: 34px; line-height: 52px; text-align: center; }
.pa-id b { display: block; font-size: 15px; }
.pa-sub { display: block; font-size: 11px; opacity: .7; }
.pa-resume { margin: 8px 0 0; font-size: 12px; line-height: 1.6; display: grid; grid-template-columns: 3.4em 1fr; gap: 1px 6px; }
.pa-resume dt { opacity: .55; }
.pa-resume dd { margin: 0; }
.pa-stats { font-size: 11px; opacity: .7; margin: 8px 0 4px; }
.pa-job { font-size: 12px; margin: 4px 0 8px; }
.pa-job-open { opacity: .5; }
.pa-jobs, .pa-policy { display: flex; flex-wrap: wrap; gap: 4px; }
.pa-policy { margin-top: 4px; }
.pa-chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: inherit; cursor: pointer; }
.pa-chip.on { background: #ffd479; color: #1a1420; border-color: #ffd479; font-weight: bold; }
.pa-actions { text-align: center; margin-top: 20px; }
.pa-go { font-size: 16px; font-weight: bold; padding: 12px 32px; border-radius: 8px; border: none; background: #ffd479; color: #1a1420; cursor: pointer; }
.pa-mormo { display: flex; gap: 12px; align-items: center; margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: rgba(120,80,180,.18); border: 1px solid rgba(190,150,255,.25); }
.pa-mormo img { width: 56px; height: 56px; object-fit: cover; object-position: top center; border-radius: 50%; flex: none; }
.pa-mormo p { margin: 0; font-size: 14px; line-height: 1.6; }
.pa-report { margin: 0; padding-left: 1.2em; line-height: 1.9; }
.pa-quote { display: block; font-size: 12px; opacity: .8; }
.pa-badge { display: inline-block; margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #ffd479; color: #1a1420; }
.pa-enemies { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pa-enemies li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.pa-enemies span { font-size: 12px; opacity: .75; }
.pa-e-icon { font-size: 18px; }
.pa-enemies em { font-size: 11px; font-style: normal; opacity: .8; }
.pa-drunk { color: #ffd479; opacity: 1 !important; font-weight: bold; }
.pa-squad { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; margin: 6px 0 12px; }
.pa-patrol { border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
.pa-patrol h3 { margin: 0 0 6px; font-size: 14px; }
.pa-ledger { font-size: 12px; line-height: 1.8; margin: 0; padding-left: 1.4em; opacity: .85; }
.pa-ledger code { opacity: .6; }
</style>
</head>
<body>
<script>
// ── 本編からの隔離 ───────────────────────────────────
// この試作は本編のセーブ（maou_save / maou_history）はもちろん、
// 戦闘速度（maou_speed）・音量（maou_volume, maou_muted）・BGM（maou_bgm）・
// KPI（maou_kpi）も汚さない。個々のモジュールを書き換える代わりに、
// このページの localStorage 自体を専用の名前空間へ丸ごと差し替える。
// これから増える鍵にも自動で効き、隔離漏れが起きない。
(function () {
  var real;
  try { real = window.localStorage; } catch (e) { return; }
  if (!real) return;
  var PREFIX = "heroproto_";
  var map = function (k) { return PREFIX + String(k); };
  var keys = function () {
    var out = [];
    for (var i = 0; i < real.length; i++) {
      var k = real.key(i);
      if (k && k.indexOf(PREFIX) === 0) out.push(k.slice(PREFIX.length));
    }
    return out;
  };
  var shim = {
    getItem: function (k) { return real.getItem(map(k)); },
    setItem: function (k, v) { real.setItem(map(k), v); },
    removeItem: function (k) { real.removeItem(map(k)); },
    key: function (i) { return keys()[i] ?? null; },
    clear: function () { keys().forEach(function (k) { real.removeItem(map(k)); }); },
    get length() { return keys().length; }
  };
  try {
    Object.defineProperty(window, "localStorage", { configurable: true, get: function () { return shim; } });
  } catch (e) { /* 差し替えられない環境では音量や速度が本編と共有される */ }
  window.__heroProtoStorage = { prefix: PREFIX, real: real };
})();
</script>
<header class="pa-wrap" style="padding-bottom:0">

  本編のセーブ・魔界史・戦績・音量・速度設定に書き込みません。</p>
