.cd-face { width: 52px; height: 68px; object-fit: cover; object-position: top center; border-radius: 5px; }

.cd-place { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
.cd-where { background: rgba(0,0,0,.4); color: inherit; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 4px 8px; }
.cd-assign { display: grid; gap: 8px; }
.cd-assign-row { display: flex; gap: 10px; align-items: center; }

.cd-lines { margin: 0; padding-left: 1.2em; line-height: 1.9; font-size: 14px; }
.cd-burst { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border-left: 3px solid #ff9a7a; background: rgba(255,154,122,.1); }
.cd-burst-line { display: flex; gap: 10px; align-items: center; margin: 4px 0; font-size: 14px; }
.cd-burst-face { width: 34px; height: 34px; object-fit: cover; object-position: top center; border-radius: 50%; flex: none; }
.cd-burst small { display: block; margin-top: 6px; font-size: 10px; letter-spacing: .15em; opacity: .55; }
.cd-ask ol { margin: 0; padding-left: 1.4em; line-height: 2; }
.cd-foot { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
.cd-go { font-size: 16px; font-weight: bold; padding: 12px 32px; border-radius: 8px; border: none; background: #ffd479; color: #1a1420; cursor: pointer; }
.cd-sub { font-size: 13px; padding: 12px 20px; border-radius: 8px; background: transparent; border: 1px solid rgba(255,255,255,.25); color: inherit; cursor: pointer; }

<script>
// ── 本編からの隔離 ───────────────────────────────────
// この試作は本編のセーブ（maou_save / maou_history）はもちろん、
// 戦闘速度（maou_speed）・音量（maou_volume, maou_muted）・BGM（maou_bgm）・
// KPI（maou_kpi）も汚さない。個々のモジュールを書き換える代わりに、
// このページの localStorage 自体を専用の名前空間へ丸ごと差し替える。
// これから増える鍵にも自動で効き、隔離漏れが起きない。
(function () {
  var real;
  try { real = window.localStorage; } catch (e) { return; }
  if (!real) return;
  var PREFIX = "heroproto_";
  var map = function (k) { return PREFIX + String(k); };
  var keys = function () {
    var out = [];
    for (var i = 0; i < real.length; i++) {
      var k = real.key(i);
      if (k && k.indexOf(PREFIX) === 0) out.push(k.slice(PREFIX.length));
    }
    return out;
  };
  var shim = {
    getItem: function (k) { return real.getItem(map(k)); },
    setItem: function (k, v) { real.setItem(map(k), v); },
    removeItem: function (k) { real.removeItem(map(k)); },
    key: function (i) { return keys()[i] ?? null; },
    clear: function () { keys().forEach(function (k) { real.removeItem(map(k)); }); },
    get length() { return keys().length; }
  };
  try {
    Object.defineProperty(window, "localStorage", { configurable: true, get: function () { return shim; } });
  } catch (e) { /* 差し替えられない環境では音量や速度が本編と共有される */ }
  window.__heroProtoStorage = { prefix: PREFIX, real: real };
})();
</script>
